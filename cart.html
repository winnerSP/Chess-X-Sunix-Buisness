<!DOCTYPE html>
<html>
<head>
    <title>Cart - <!-- LOGO\NAME --></title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <!-- LOGO\NAME -->
    <div class="logo">LOGO\NAME</div>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >
        <button onclick="window.location.href='index.html'">
            Search
        </button>
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
        <a href="about.html">About</a>
    </div>

</nav>


<main>

    <section class="title-section">

        <div class="title-bubble">

            <h1>Your Cart</h1>

            <p>Review your items before buying.</p>

        </div>

    </section>


    <section class="cart-container">

        <div id="cartItems"></div>

        <div id="emptyCart" class="empty-cart">

            <h2>Your cart is empty.</h2>

            <p>Add some products from the store!</p>

            <a href="index.html">
                <button>Continue Shopping</button>
            </a>

        </div>


        <div id="cartSummary" class="cart-summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="subtotal">₹0</strong>
            </div>

            <div class="summary-row">
                <span>Delivery</span>
                <strong id="delivery">₹0</strong>
            </div>

            <div class="summary-total">
                <span>Total</span>
                <strong id="total">₹0</strong>
            </div>

            <button
                class="buy-button"
                onclick="checkout()"
            >
                Buy Now
            </button>

        </div>

    </section>

</main>


<script src="script.js"></script>


<script>

/* =========================
   DISPLAY CART
========================= */

function displayCart() {

    const cartItems =
        document.getElementById("cartItems");

    const emptyCart =
        document.getElementById("emptyCart");

    const cartSummary =
        document.getElementById("cartSummary");

    const subtotalElement =
        document.getElementById("subtotal");

    const deliveryElement =
        document.getElementById("delivery");

    const totalElement =
        document.getElementById("total");


    if (cart.length === 0) {

        emptyCart.style.display = "block";
        cartSummary.style.display = "none";

        return;
    }


    emptyCart.style.display = "none";
    cartSummary.style.display = "block";


    cartItems.innerHTML = "";


    let subtotal = 0;


    cart.forEach(function(product, index) {

        const itemTotal =
            product.price * product.quantity;

        subtotal += itemTotal;


        const item =
            document.createElement("div");

        item.className = "cart-item";


        item.innerHTML = `

            <div>

                <h2>${product.name}</h2>

                <p>₹${product.price} × ${product.quantity}</p>

            </div>

            <strong>
                ₹${itemTotal}
            </strong>

            <div class="quantity-buttons">

                <button onclick="changeQuantity(${index}, -1)">
                    −
                </button>

                <span>${product.quantity}</span>

                <button onclick="changeQuantity(${index}, 1)">
                    +
                </button>

                <button onclick="removeFromCart(${index})">
                    Remove
                </button>

            </div>

        `;


        cartItems.appendChild(item);

    });


    /*
        Delivery is currently FREE.
        We can change this later to database-controlled
        delivery pricing.
    */

    const delivery = 0;

    const total = subtotal + delivery;


    subtotalElement.textContent =
        "₹" + subtotal;

    deliveryElement.textContent =
        "₹" + delivery;

    totalElement.textContent =
        "₹" + total;

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(index, amount) {

    cart[index].quantity += amount;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart();

    displayCart();

}


/* =========================
   REMOVE PRODUCT
========================= */

function removeFromCart(index) {

    cart.splice(index, 1);

    saveCart();

    displayCart();

}


/* =========================
   CHECKOUT
========================= */

function checkout() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;
    }


    alert(
        "Checkout system coming soon!"
    );

}


/* LOAD CART */

displayCart();

</script>

</body>
</html>
