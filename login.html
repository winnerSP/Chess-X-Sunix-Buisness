<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — CHESS X SUNIX</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<main class="features">

    <div class="feature-card">

        <h1>CHESS X SUNIX</h1>

        <h2>Login</h2>

        <input
            id="username"
            type="text"
            placeholder="Username"
        >

        <br><br>

        <button
            class="primary-button"
            onclick="login()"
        >
            Login
        </button>

        <p id="login-status"></p>

    </div>

</main>


<script src="storage.js"></script>
<script src="auth.js"></script>

</body>

</html>
