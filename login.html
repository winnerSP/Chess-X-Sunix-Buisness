<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CHESS X SUNIX</title>

    <link
        rel="stylesheet"
        href="login.css"
    >
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <h1>CHESS X SUNIX</h1>

            <h2>Login</h2>

            <p class="login-subtitle">
                Sign in to your CHESS X SUNIX account.
            </p>


            <form id="loginForm">

                <!-- USERNAME -->

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    maxlength="31"
                    required
                >


                <!-- PASSWORD -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <!-- TERMS -->

                <div class="terms-row">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                    >

                    <label for="terms">
                        I agree to the
                        <a
                            href="terms.html"
                            target="_blank"
                            rel="noopener"
                        >
                            Terms & Conditions
                        </a>
                    </label>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    id="loginButton"
                >
                    Login
                </button>


                <!-- CREATE ACCOUNT -->

                <button
                    type="button"
                    id="createAccountButton"
                >
                    Create Account
                </button>

            </form>


            <!-- SERVER MESSAGE -->

            <div
                id="loginMessage"
                role="status"
                aria-live="polite"
            ></div>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
