<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CHESS X SUNIX</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <div class="login-overlay">

        <main class="login-container">

            <section class="login-box">

                <h1>CHESS X SUNIX</h1>


                <form
                    id="loginForm"
                    method="post"
                >

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Username"
                        autocomplete="username"
                        maxlength="31"
                        required
                    >


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >


                    <div class="terms-row">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                        >

                        <label for="terms">

                            I agree to the
                            <a
                                href="terms.html"
                                target="_blank"
                                rel="noopener"
                            >
                                Terms & Conditions
                            </a>

                        </label>

                    </div>


                    <button
                        type="submit"
                        id="loginButton"
                    >
                        Login
                    </button>


                    <button
                        type="button"
                        id="createAccountButton"
                    >
                        Create Account
                    </button>

                </form>


                <div
                    id="loginMessage"
                    role="status"
                    aria-live="polite"
                ></div>

            </section>

        </main>

    </div>


    <script src="login.js"></script>

</body>

</html>
